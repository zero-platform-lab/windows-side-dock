[package]
name = "windows-side-dock-shell"
version = "0.1.27"
edition = "2021"
description = "Windows 11の右クリックメニューにWindows Side Dockの項目を出すシェル拡張"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_System_Com",
	"Win32_System_LibraryLoader",
	"Win32_System_Registry",
	"Win32_System_SystemServices",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
